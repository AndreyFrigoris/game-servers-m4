services:
  ark:
    image: sonroyaalmerol/steamcmd-arm64:latest
    container_name: ark
    environment:
      - TZ=${TZ:-UTC}
      - SESSION_NAME=${SESSION_NAME:-My ARK Server}
      - MAP=${MAP:-TheIsland}
      - GAME_PORT=${GAME_PORT:-7777}
      - QUERY_PORT=${QUERY_PORT:-27017}
      - MAX_PLAYERS=${MAX_PLAYERS:-2}
      - RUN_STEAMCMD=${RUN_STEAMCMD:-0}
      - ARM64_DEVICE=${ARM64_DEVICE:-generic}
      # Conservative Box64 profile (same idea as V Rising). emulators.rc can override.
      - BOX64_DYNAREC_STRONGMEM=1
      - BOX64_DYNAREC_BIGBLOCK=0
      - BOX64_DYNAREC_SAFEFLAGS=1
      - BOX64_DYNAREC_FASTNAN=0
      - BOX64_DYNAREC_FASTROUND=0
      - BOX64_DYNAREC_X87DOUBLE=1
      - BOX64_DYNAREC_BLEEDING_EDGE=0
    volumes:
      - ./server:/mnt/ark/server
      - ./persistentdata:/mnt/ark/server/ShooterGame/Saved
      - ./scripts/start-wrapper.sh:/start-wrapper.sh:ro
    entrypoint:
      - /bin/bash
      - /start-wrapper.sh
    ports:
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "27017:27017/udp"
    shm_size: "1gb"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    restart: unless-stopped
    stop_grace_period: 90s
    network_mode: bridge
